# ==============================================================================
# TinyArmSim Complete Microarchitectural Configuration Template
# ==============================================================================
# This template demonstrates every configurable parameter across Core, Cache,
# Branch Predictor, LSU, and Coherence subsystems with their default values.
# ==============================================================================

[global]
# Number of simulated CPU cores (1..16)
num_cores = 1

# Enable Multi-Core MESI cache coherence protocol (true / false)
enable_mesi = true

# Main memory (DRAM) access latency in cycles
dram_latency = 80


[core]
# Enable Out-of-Order superscalar execution engine (true / false)
# If false, degrades gracefully to 1-wide in-order execution
enable_ooo = true

# Pipeline stage widths (instructions/uops processed per cycle)
fetch_width = 4
decode_width = 4
issue_width = 4
commit_width = 4

# Reorder Buffer (ROB) capacity in entries (16..512)
rob_size = 64

# Reservation Station / Issue Queue capacity in entries (8..256)
rs_size = 32

# Physical Register File (PRF) size (must be > 16)
num_phys_regs = 128

# Loop Stream Detector (LSD) configuration
# lsd_type = NONE | LOOP_STREAM (or enable_lsd = true/false)
enable_lsd = false
lsd_capacity = 32

# Macro-Op Instruction Fusion configuration
# fusion_mode = NONE | CMP_BRANCH (or enable_macro_fusion = true/false)
enable_macro_fusion = false
fusion_mode = NONE


[branch_predictor]
# Enable dynamic branch prediction (if false, acts as 100% ideal perfect predictor)
enabled = true

# Predictor algorithm: IDEAL | BIMODAL | GSHARE | TAGE
type = TAGE

# Pattern History Table (PHT) entries (must be a power of 2)
table_size = 4096


[lsu]
# Enable detailed Load/Store Unit modeling (true / false)
# If false, memory accesses bypass directly to cache/memory without queue delays
enabled = true

# Load Queue (LQ) and Store Queue (SQ) capacity in entries
lq_size = 16
sq_size = 16

# Enable speculative Store-to-Load data forwarding (true / false)
enable_forwarding = true


[l1i]
# Core L1 Instruction Cache (if false, 0-latency ideal fetch)
enabled = true
size_bytes = 32768      # 32KB
line_size = 64          # 64 Bytes
associativity = 4       # 4-way set associative
hit_latency = 1         # 1 cycle hit latency
prefetcher = NONE       # Hardware Prefetcher: NONE | NEXT_LINE | STRIDE | STREAM
prefetch_distance = 1   # Prefetch lookahead distance (in cache lines)
prefetch_queue_size = 8 # Prefetch request queue capacity


[l1d]
# Core L1 Data Cache (if false, bypasses to L2 / DRAM)
enabled = true
size_bytes = 32768      # 32KB
line_size = 64          # 64 Bytes
associativity = 4       # 4-way set associative
hit_latency = 1         # 1 cycle hit latency
prefetcher = NONE       # Hardware Prefetcher: NONE | NEXT_LINE | STRIDE | STREAM
prefetch_distance = 1   # Prefetch lookahead distance (in cache lines)
prefetch_queue_size = 8 # Prefetch request queue capacity


[l2]
# Multi-Core Shared L2 / Last Level Cache (LLC)
enabled = true
size_bytes = 524288     # 512KB
line_size = 64          # 64 Bytes
associativity = 8       # 8-way set associative
hit_latency = 10        # 10 cycles hit latency
prefetcher = NONE       # Hardware Prefetcher: NONE | NEXT_LINE | STRIDE | STREAM
prefetch_distance = 1   # Prefetch lookahead distance (in cache lines)
prefetch_queue_size = 8 # Prefetch request queue capacity

