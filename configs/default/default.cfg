# ==============================================================================
# TinyCpuSim Default Microarchitecture Configuration
# Standard 4-Wide Out-of-Order (RS/PRF/ROB) Pipeline with Multi-Level Caches
# ==============================================================================

[simulation]
elf_path = tests/fixtures/test_fibonacci.elf
mode = uarch
max_steps = 1000000000
all_perf = true
enable_topdown = true

[system]
num_cores = 1
dram_latency_cycles = 80
coherence = MESI

[core]
type = OOO_DYNAMIC
fetch_width = 3
decode_width = 3
rename_width = 3
issue_width = 8
commit_width = 8
rob_size = 40
rs_size = 32
num_phys_regs = 128

[branch_predictor]
type = BIMODE
table_size = 8192
btb_size = 2048
ras_size = 16
tage_tables = 4

[lsu]
type = SPECULATIVE_OOO
lq_size = 16
sq_size = 16
store_forward_latency = 1

[l1i]
type = SET_ASSOCIATIVE
size_bytes = 32768
line_size = 64
associativity = 4
hit_latency_cycles = 1
mshr_entries = 8

[l1d]
type = SET_ASSOCIATIVE
size_bytes = 32768
line_size = 64
associativity = 4
hit_latency_cycles = 2
mshr_entries = 8

[l2]
type = SET_ASSOCIATIVE
size_bytes = 524288
line_size = 64
associativity = 8
hit_latency_cycles = 10
mshr_entries = 16
